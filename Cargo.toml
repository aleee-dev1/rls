[package]
name = "rls"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["std", "help", "usage", "error-context", "color", "suggestions", "wrap_help", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
